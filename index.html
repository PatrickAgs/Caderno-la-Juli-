<title>Caderno La Julí</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Visual da agenda do salão: fundo claro e liso, cartões brancos de traço fino, títulos grandes
     na serifa do site, botões pretos retos e um traço rosa como destaque. Uma coluna, abas embaixo. */
  :root {
    --bg: #f7f3ee;
    --sup: #ffffff;
    --sup-2: #fbf8f4;
    --fg: #141012;
    --fg-suave: #6f666a;
    --rosa: #b8466f;
    --dourado-texto: #86672a;
    --dourado: #d5b06c;
    --linha: #e7e2dc;
    --linha-fraca: #efebe6;
    --entrada: #2c7650;
    --saida: #b0384a;
    --sombra: 0 24px 60px rgba(20, 16, 18, .22);
    --veu: rgba(20, 16, 18, .5);
    --fonte-titulo: 'Cormorant Garamond', Georgia, serif;
    --fonte-texto: 'Lora', Georgia, 'Times New Roman', serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--fonte-texto); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--rosa); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

  /* ---------- cabeçalho e página ---------- */
  .tela { max-width: 600px; margin-inline: auto; }
  .faixa { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 10px; }
  .faixa-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 62px; border-bottom: 1px solid var(--linha); margin-bottom: 14px; }
  .faixa-topo .logo img { height: 40px; width: auto; display: block; }
  .faixa-topo .acoes-topo { display: flex; gap: 2px; margin-left: auto; }
  .chapeu { display: inline-flex; align-items: center; gap: 12px; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-suave); margin: 0; }
  .chapeu i { width: 28px; height: 2px; background: var(--rosa); display: block; }
  .titulo { font-family: var(--fonte-titulo); font-weight: 500; font-size: clamp(2.6rem, 11vw, 3.4rem); line-height: .95; letter-spacing: -.01em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
  .titulo em { font-style: italic; color: var(--rosa); }
  .faixa .grande { font-family: var(--fonte-titulo); font-size: 3.1rem; font-weight: 600; line-height: 1; margin: 0; letter-spacing: -.01em; }
  .faixa .sub { font-size: .86rem; color: var(--fg-suave); margin: 0; }
  .btn-branco { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 5px; border: 1px solid transparent; background: none; color: var(--fg); flex: none; text-decoration: none; }
  .btn-branco:hover { border-color: var(--linha); }
  .mes-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mes-nav b { font-family: var(--fonte-titulo); font-size: 1.6rem; font-weight: 500; }
  .mes-nav .btn-branco { border-color: var(--linha); background: var(--sup); }

  .folha { padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(110px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }

  /* ---------- cartões ---------- */
  .cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: 8px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
  .cartao h2 { font-size: .72rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-suave); margin: 0; }
  .cartao-rodape { border-top: 1px solid var(--linha); margin: 4px -18px -18px; padding: 14px; text-align: center; font-weight: 500; color: var(--fg); text-decoration: none; display: block; }
  .linha-tit { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .visao { display: grid; gap: 4px; }
  .visao div { display: flex; align-items: center; gap: 12px; font-weight: 500; padding: 6px 0; }
  .visao div + div { border-top: 1px solid var(--linha-fraca); }
  .visao div b { margin-left: auto; font-family: var(--fonte-titulo); font-size: 1.7rem; font-weight: 600; color: var(--fg); line-height: 1; }
  .bola { width: 30px; height: 30px; border-radius: 5px; display: grid; place-items: center; flex: none; border: 1px solid var(--linha); background: var(--sup-2); }
  .bola svg.ic { width: 16px; height: 16px; stroke-width: 1.8; }
  .bola.v { color: var(--saida); } .bola.g { color: var(--entrada); }
  .visao .tv, .visao .tg { color: var(--fg); }
  .tv { color: var(--saida); } .tg { color: var(--entrada); }
  .tres { display: grid; grid-template-columns: repeat(3, 1fr); }
  .dois { display: grid; grid-template-columns: 1fr 1fr; }
  .dois > div + div, .tres > div + div { border-left: 1px solid var(--linha); padding-left: 12px; }
  .tres > div, .dois > div { display: grid; gap: 4px; min-width: 0; }
  .tres span, .dois span { font-size: .7rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-suave); }
  .tres b, .dois b { font-size: clamp(.82rem, 3.7vw, 1.02rem); font-weight: 600; white-space: nowrap; }
  .dois b { font-family: var(--fonte-titulo); font-size: clamp(1.35rem, 6.2vw, 1.9rem); line-height: 1; }

  .lista { list-style: none; margin: 0; padding: 0; display: grid; }
  .data-grupo { font-size: .72rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-suave); padding: 14px 0 6px; border-bottom: 1px solid var(--linha); }
  .lista > li:first-child > .data-grupo { padding-top: 0; }
  .item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border: 0; background: none; width: 100%; text-align: left; color: inherit; text-decoration: none; }

    right: max(16px, calc((100vw - 600px) / 2 + 16px), env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }

  /* ---------- análise ---------- */
  function telaAnalise() {
    const n = Number(periodo);

    const porMes = meses.map(([a, m]) => { const l = doMes(db.lanc, a, m); return { a, m, e: soma(l, 'entrada'), s: soma(l, 'saida') }; });
    const noPeriodo = meses.flatMap(([a, m]) => doMes(db.lanc, a, m));
    const ent = soma(noPeriodo, 'entrada'), sai = soma(noPeriodo, 'saida'), lucro = ent - sai;
    const margem = ent > 0 ? Math.round(lucro / ent * 100) : 0;
    const porCat = (tipo, cats) => cats.map(c => ({ c, v: noPeriodo.filter(l => l.tipo === tipo && l.categoria === c).reduce((t, l) => t + l.valor, 0) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
    const nomes = { '1': 'este mês', '3': 'em 3 meses', '6': 'em 6 meses', '12': 'em 12 meses' };
    const comPend = db.pedidos.filter(p => restanteDe(p) > 0).length, semPend = db.pedidos.length - comPend;
    return `<section class="faixa">${topoTitulo('Como está o <em>negócio</em>', '', botaoAjustes, 'Análise')}
        <div class="chips" role="group" aria-label="Período">${[['1', 'Mês'], ['3', '3 meses'], ['6', '6 meses'], ['12', '12 meses']].map(([v, t]) => `<button class="chip" data-periodo="${v}" aria-pressed="${periodo === v}">${t}</button>`).join('')}</div>
        <p class="chapeu"><i aria-hidden="true"></i>Lucro ${nomes[periodo]}</p>
        <p class="grande num">${R(lucro)}</p>
      </section>
      <div class="folha">
        <section class="cartao">
          <div class="dois"><div><span>Entrou</span><b class="tg num">${R(ent)}</b></div><div><span>Saiu</span><b class="tv num">${R(sai)}</b></div></div>
          <p class="nota" style="text-align:left">Margem de lucro: <b style="color:var(--fg)">${margem}%</b> de cada real que entrou.</p>
        </section>
        ${n > 1 ? `<section class="cartao"><h2>Entradas e saídas por mês</h2>${graficoMeses(porMes)}
          <div class="legenda-mini"><span><i style="background:var(--entrada)"></i>Entradas</span><span><i style="background:var(--saida)"></i>Saídas</span></div></section>` : ''}
        <section class="cartao"><h2>Total de dívidas ${db.pedidos.length}</h2>
          ${db.pedidos.length ? `${rosca(comPend, semPend)}
          <div class="legenda">
            <div><i style="background:var(--saida)"></i>Com pendência<b class="num">${pct(comPend, db.pedidos.length)}</b></div>
            <div><i style="background:var(--entrada)"></i>Pagas<b class="num">${pct(semPend, db.pedidos.length)}</b></div>
          </div>` : `<p class="nota">Nenhuma dívida anotada ainda.</p>`}
        </section>
        <section class="cartao"><h2>Produtos mais vendidos</h2>${barras(maisVendidos(meses).map(x => ({ c: `${x.nome} · ${x.qtd}`, v: x.valor })), 'var(--rosa)', maisVendidos(meses).reduce((t, x) => t + x.valor, 0))}</section>
        <section class="cartao"><h2>Para onde vai o dinheiro</h2>${barras(porCat('saida', CAT_SAIDA), 'var(--saida)', sai)}</section>
        <section class="cartao"><h2>De onde vem o dinheiro</h2>${barras(porCat('entrada', CAT_ENTRADA), 'var(--entrada)', ent)}</section>
      </div>`;
  }
  const pct = (a, t) => (t ? (a / t * 100) : 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
  function rosca(a, b) {
    const t = a + b, r = 80, cx = 100, cy = 100, C = 2 * Math.PI * r;
    const fa = a / t;
    const meio = ang => [cx + r * Math.sin(ang), cy - r * Math.cos(ang)];
    const [xa, ya] = meio(Math.PI * fa), [xb, yb] = meio(Math.PI * (2 * fa + (1 - fa)));
    return `<svg class="rosca" viewBox="0 0 200 200" role="img" aria-label="${a} dívidas com pendência e ${b} pagas">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--entrada)" stroke-width="36"/>
      ${a ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--saida)" stroke-width="36" stroke-dasharray="${C * fa} ${C}" transform="rotate(-90 ${cx} ${cy})"/>` : ''}
      <circle cx="${cx}" cy="${cy}" r="60" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="6"/>
      ${a ? `<text x="${xa}" y="${ya + 6}" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">${a}</text>` : ''}
      ${b ? `<text x="${xb}" y="${yb + 6}" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">${b}</text>` : ''}
    </svg>`;
  }
  function escala(max) {
    if (max <= 0) return [25, 100];
    const pot = Math.pow(10, Math.floor(Math.log10(max)));
    const passo = [1, 2, 2.5, 5, 10].map(f => f * pot).find(p => p * 4 >= max);
    return [passo, passo * Math.ceil(max / passo)];
  }
  function graficoMeses(dados) {
    const W = 320, H = 170, esq = 40, base = 145, topo = 10;
    const max = Math.max(...dados.map(d => Math.max(d.e, d.s)), 0);
    const [passo, teto] = escala(max);
    const y = v => base - (v / teto) * (base - topo);
    const larg = (W - esq) / dados.length, bw = Math.min(14, larg / 3);
    const curto = v => v >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : String(v);
    let g = '';
    for (let v = 0; v <= teto + .001; v += passo) g += `<line class="grade" x1="${esq}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${esq - 6}" y="${y(v) + 3}" text-anchor="end">${curto(v)}</text>`;
    dados.forEach((d, i) => {
      const cx = esq + larg * i + larg / 2, atual = i === dados.length - 1;
      g += `<rect x="${cx - bw - 1}" y="${y(d.e)}" width="${bw}" height="${Math.max(0, base - y(d.e))}" rx="3" fill="var(--entrada)"><title>${mesNome(d.a, d.m)}: entrou ${R(d.e)}</title></rect>`;
      g += `<rect x="${cx + 1}" y="${y(d.s)}" width="${bw}" height="${Math.max(0, base - y(d.s))}" rx="3" fill="var(--saida)"><title>${mesNome(d.a, d.m)}: saiu ${R(d.s)}</title></rect>`;
      if (dados.length <= 6 || i % 2 === (dados.length - 1) % 2) g += `<text x="${cx}" y="${base + 16}" text-anchor="middle" ${atual ? 'style="fill:var(--fg);font-weight:600"' : ''}>${mesCurto(d.a, d.m)}</text>`;
    });
    return `<div class="grafico"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">${g}</svg></div>`;
  }
  function barras(itens, cor, total) {
    if (!itens.length) return `<p class="nota" style="text-align:left">Nada lançado neste período.</p>`;
    const max = itens[0].v;

  }

  /* ---------- produtos ---------- */
  const textoItens = itens => itens.map(i => `${i.qtd} ${i.nome}`).join(', ');
  function vendasDoPeriodo(meses) {
    const fontes = [...db.lanc.filter(l => l.tipo === 'entrada'), ...db.pedidos];

  function seletorProdutos(itens = []) {

  function lerItens(f) { try { return JSON.parse(f.get('itens') || '[]'); } catch (e) { return []; } }
  $('#folha-form').addEventListener('click', e => {
    const b = e.target.closest('[data-passo]'); if (!b) return;

    const antes = form.itens.value;

      <label class="campo"><span>Preço</span><input class="dinheiro num" name="valor" inputmode="decimal" placeholder="R$ 0,00" value="${valorCampo(p.preco)}" autocomplete="off"></label>
      ${p.id ? `<p class="nota">Mudar o preço não altera as vendas já anotadas.</p>` : ''}`;
    abrirFolha(p.id ? 'Editar produto' : 'Novo produto', corpo, f => {
      const nome = f.get('nome').trim(), preco = lerValor(f.get('valor'));
      if (!nome) return 'Digite o nome do produto.';
      if (!(preco > 0)) return 'Digite o preço.';
      if (p.id) Object.assign(db.produtos.find(x => x.id === p.id), { nome, preco });
      else db.produtos.push({ id: novoId(), nome, preco });
      aviso(p.id ? 'Produto alterado' : 'Produto cadastrado');
    }, p.id ? () => { db.produtos = db.produtos.filter(x => x.id !== p.id); } : null);
    setTimeout(() => { if (!p.id) form.nome.focus(); }, 60);
  }

  /* ---------- materiais ---------- */
  const fmtQtd = q => (Math.round(q * 100) / 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
  const estoqueDe = id => db.movMat.filter(m => m.materialId === id).reduce((t, m) => t + (m.tipo === 'entrada' ? m.qtd : -m.qtd), 0);
  const material = id => db.materiais.find(m => m.id === id);
  const temMov = id => db.movMat.some(x => x.materialId === id);
  // Níveis definidos no cadastro: até "baixo" fica vermelho, até "médio" amarelo, acima disso verde. "Cheio" é o estoque ideal (barra cheia).
  function niveis(m) {
    const baixo = m.baixo ?? m.minimo ?? 0;
    const medio = m.medio ?? (baixo ? baixo * 2 : 0);
    const cheio = m.cheio ?? (baixo ? baixo * 4 : 0);
    return { baixo, medio, cheio };
  }
  function nivelDe(m) {
    const q = estoqueDe(m.id), n = niveis(m);
    if (q <= 0 || q <= n.baixo) return 'baixo';
    if (q <= n.medio) return 'medio';
    return 'cheio';
  }
  const NOME_NIVEL = { baixo: 'Baixo', medio: 'Médio', cheio: 'Cheio' };
  const COR_NIVEL = { baixo: 'var(--saida)', medio: '#d9a520', cheio: 'var(--entrada)' };
  const acabando = m => nivelDe(m) === 'baixo';
  const rotuloNivel = m => { const nv = nivelDe(m); return nv === 'cheio' && niveis(m).cheio && estoqueDe(m.id) < niveis(m).cheio ? 'Bom' : NOME_NIVEL[nv]; };
  const UNIDADES = ['unidade', 'lata', 'caixinha', 'caixa', 'kg', 'g', 'litro', 'pacote', 'pote', 'vidro', 'envelope', 'bandeja', 'dúzia', 'rolo'];
  function telaMateriais() {
    const ordemNivel = { baixo: 0, medio: 1, cheio: 2 };
    const lista = [...db.materiais].sort((a, b) => ordemNivel[nivelDe(a)] - ordemNivel[nivelDe(b)] || temMov(b.id) - temMov(a.id) || (a.categoria || '').localeCompare(b.categoria || '') || a.nome.localeCompare(b.nome));
    const poucos = lista.filter(acabando).length, medios = lista.filter(m => nivelDe(m) === 'medio').length, cheios = lista.length - poucos - medios;
    const gastoMes = doMes(db.movMat.filter(m => m.tipo === 'entrada'), agora.getFullYear(), agora.getMonth()).reduce((t, m) => t + (m.valor || 0), 0);
    return `<section class="faixa">${topoTitulo('Entrada e saída de <em>materiais</em>', '', botaoAjustes, 'Materiais')}
        <p class="sub">Anote a entrada quando comprar e a saída quando usar. O estoque é calculado sozinho. Os itens mais comuns de bolos e tortas já estão na lista; toque num item para mudar ou excluir.</p>
      </section>
      <div class="folha">
        ${db.materiais.length ? `<section class="cartao"><div class="dois">
          <div><span>Estoque baixo</span><b class="num ${poucos ? 'tv' : 'tg'}">${poucos} ${poucos === 1 ? 'item' : 'itens'}</b></div>
          <div><span>Compras do mês</span><b class="num">${R(gastoMes)}</b></div></div>
          <div class="legenda-niveis"><span class="nivel n-baixo"><i></i>${poucos} baixo</span><span class="nivel n-medio"><i></i>${medios} médio</span><span class="nivel n-cheio"><i></i>${cheios} bom ou cheio</span></div></section>
        <div class="acoes"><button class="btn btn-cheio" data-acao="mat-entrada">${ic('entra')}Entrada</button><button class="btn" data-acao="mat-saida">${ic('sai')}Saída</button></div>` : ''}
        <section class="cartao">
          <div class="linha-tit"><h2>Estoque</h2><button class="btn" data-acao="novo-material" style="min-height:40px">${ic('mais')}Material</button></div>
          ${lista.length ? `<ul class="lista">${lista.map(m => { const q = estoqueDe(m.id), nv = nivelDe(m), cheio = niveis(m).cheio; return `<li><a class="item" href="#material-${m.id}">
            <span class="marca-mov n-${nv}">${ic('caixa')}</span>
            <span class="txt"><span class="t">${esc(m.nome)}</span><span class="s"><span class="nivel n-${nv}"><i></i>${temMov(m.id) ? rotuloNivel(m) : 'Vazio'}</span> · ${esc(m.categoria || '')}</span></span>
            <span class="dir"><b class="num">${fmtQtd(Math.max(0, q))} ${esc(m.unidade)}</b>${cheio ? `<span class="barrinha"><i style="width:${Math.min(100, Math.max(0, q / cheio * 100)).toFixed(0)}%;background:${COR_NIVEL[nv]}"></i></span>` : ''}</span></a></li>`; }).join('')}</ul>`
            : vazioHTML('caixa', 'Nenhum material cadastrado.', 'Cadastre o que você compra para fazer os doces: leite condensado, creme de leite, potes, caixas.')}
        </section>
      </div>`;
  }
  function telaMaterial(id) {
    const m = material(id);
    if (!m) return `<section class="faixa">${topoTitulo('Material', `<a class="btn-branco" href="#materiais" aria-label="Voltar">${ic('voltar')}</a>`)}</section><div class="folha">${vazioHTML('caixa', 'Material não encontrado.', 'Pode ter sido excluído.')}</div>`;
    const q = estoqueDe(id);
    const movs = db.movMat.filter(x => x.materialId === id).sort((a, b) => -ordem(a, b));
    const comprado = movs.filter(x => x.tipo === 'entrada' && x.valor > 0);
    const qComprada = comprado.reduce((t, x) => t + x.qtd, 0), vComprado = comprado.reduce((t, x) => t + x.valor, 0);
    return `<section class="faixa">${topoTitulo(esc(m.nome), `<a class="btn-branco" href="#materiais" aria-label="Voltar para materiais">${ic('voltar')}</a>`, `<button class="btn-branco" data-acao="editar-material" data-material="${id}" aria-label="Editar material">${ic('lapis')}</button>`, 'Material')}
        <p class="chapeu"><i aria-hidden="true"></i>Em estoque</p>
        <p class="grande num ${q <= 0 ? 'tv' : ''}">${fmtQtd(q)} <span style="font-size:.5em">${esc(m.unidade)}</span></p>
        <p class="sub"><span class="nivel n-${nivelDe(m)}" style="font-size:.9rem"><i></i>Estoque ${rotuloNivel(m).toLowerCase()}</span>${niveis(m).cheio ? ` · baixo até ${fmtQtd(niveis(m).baixo)}, médio até ${fmtQtd(niveis(m).medio)}, cheio com ${fmtQtd(niveis(m).cheio)}` : ''}</p>
      </section>
      <div class="folha">
        <div class="acoes"><button class="btn btn-cheio" data-acao="mat-entrada" data-material="${id}">${ic('entra')}Entrada</button><button class="btn" data-acao="mat-saida" data-material="${id}">${ic('sai')}Saída</button></div>
        ${qComprada ? `<section class="cartao"><div class="dois"><div><span>Preço médio</span><b class="num">${R(vComprado / qComprada)}</b></div><div><span>Total comprado</span><b class="num">${R(vComprado)}</b></div></div><p class="nota" style="text-align:left">Preço médio por ${esc(m.unidade)}, contando as compras com valor anotado.</p></section>` : ''}
        <section class="cartao"><h2>Movimentações</h2>
          ${movs.length ? `<ul class="lista">${movs.map(x => { const e = x.tipo === 'entrada'; return `<li><button class="item" data-mov="${x.id}">
            <span class="marca-mov ${e ? 'e' : 's'}">${ic(e ? 'entra' : 'sai')}</span>
            <span class="txt"><span class="t">${e ? 'Entrada' : 'Saída'} · ${dataBR(x.data)}</span><span class="s">${esc(x.obs || (e && x.valor ? 'Compra' : e ? 'Entrada' : 'Uso'))}${e && x.valor ? ' · ' + R(x.valor) : ''}</span></span>
            <span class="dir"><b class="num ${e ? 'tg' : 'tv'}">${e ? '+' : '−'} ${fmtQtd(x.qtd)}</b></span></button></li>`; }).join('')}</ul>`
            : vazioHTML('caixa', 'Sem movimentações.', 'Toque em Entrada para anotar a primeira compra.')}
        </section>
      </div>`;
  }
  function formMaterial(m = {}) {
    const nv0 = m.id ? niveis(m) : { baixo: 0, medio: 0, cheio: 0 };
    const corpo = `${campoTexto('nome', 'Nome', m.nome, 'Ex.: Leite condensado')}
      <label class="campo"><span>Unidade</span><input name="unidade" list="unidades" value="${esc(m.unidade || 'unidade')}" autocomplete="off"></label>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <label class="campo"><span class="nivel n-baixo"><i></i>Baixo até</span><input name="baixo" inputmode="decimal" value="${nv0.baixo ? fmtQtd(nv0.baixo) : ''}" placeholder="Ex.: 3"></label>
          <label class="campo"><span class="nivel n-medio"><i></i>Médio até</span><input name="medio" inputmode="decimal" value="${nv0.medio ? fmtQtd(nv0.medio) : ''}" placeholder="Ex.: 8"></label>
          <label class="campo"><span class="nivel n-cheio"><i></i>Cheio com</span><input name="cheio" inputmode="decimal" value="${nv0.cheio ? fmtQtd(nv0.cheio) : ''}" placeholder="Ex.: 15"></label>

      </div>
      <datalist id="unidades">${UNIDADES.map(u => `<option value="${u}">`).join('')}</datalist>

      ${!m.id ? `<label class="campo"><span>Quanto tem agora (opcional)</span><input name="inicial" inputmode="decimal" placeholder="Ex.: 12"></label>` : `<p class="nota">Excluir o material apaga as movimentações dele. As compras já lançadas no caixa continuam lá.</p>`}
      <p class="nota">Com o estoque até o número de "baixo", o item fica vermelho. Até o de "médio", fica amarelo. Acima disso, fica verde (bom). Ao chegar no número de "cheio", aparece como cheio e a barrinha da lista fica completa.</p>`;
    abrirFolha(m.id ? 'Editar material' : 'Novo material', corpo, f => {
      const nome = f.get('nome').trim();
      if (!nome) return 'Digite o nome do material.';
      const baixo = lerValor(f.get('baixo')) || 0, medio = lerValor(f.get('medio')) || 0, cheio = lerValor(f.get('cheio')) || 0;
      if (medio && medio <= baixo) return 'O número do médio precisa ser maior que o do baixo.';
      if (cheio && cheio <= Math.max(baixo, medio)) return 'O número do cheio precisa ser maior que o do médio.';
      const dados = { nome, unidade: f.get('unidade').trim() || 'unidade', baixo, medio: medio || baixo, cheio: cheio || Math.max(baixo, medio) * 2, categoria: f.get('categoria') };
      if (m.id) Object.assign(material(m.id), dados);
      else {
        const id = novoId(); db.materiais.push({ id, ...dados });
        const ini = lerValor(f.get('inicial'));
        if (ini > 0) db.movMat.push({ id: novoId(), criado: Date.now(), materialId: id, tipo: 'entrada', qtd: ini, valor: null, data: hoje(), obs: 'Estoque inicial' });
        setTimeout(() => location.hash = 'material-' + id);
      }
      aviso(m.id ? 'Material alterado' : 'Material cadastrado');
    }, m.id ? () => { db.materiais = db.materiais.filter(x => x.id !== m.id); db.movMat = db.movMat.filter(x => x.materialId !== m.id); location.hash = 'materiais'; } : null);
    setTimeout(() => { if (!m.id) form.nome.focus(); }, 60);
  }
  function formMov(tipo, mv = {}) {
    if (!db.materiais.length) { formMaterial(); aviso('Cadastre o material primeiro'); return; }
    const e = tipo === 'entrada';
    const mat = mv.materialId && material(mv.materialId);
    const lanc = mv.lancId && db.lanc.find(l => l.id === mv.lancId);
    const corpo = `${!mv.id ? `<div class="chips" role="group" aria-label="Tipo">${[['entrada', 'Entrada (comprei)'], ['saida', 'Saída (usei)']].map(([v, t]) => `<button type="button" class="chip" data-trocar-tipo="${v}" aria-pressed="${v === tipo}">${t}</button>`).join('')}</div>` : ''}
      <label class="campo"><span>Material</span><select name="materialId">${[...db.materiais].sort((a, b) => a.nome.localeCompare(b.nome)).map(m => `<option value="${m.id}" ${m.id === mv.materialId ? 'selected' : ''}>${esc(m.nome)} (${fmtQtd(estoqueDe(m.id))} ${esc(m.unidade)})</option>`).join('')}</select></label>
      <label class="campo"><span>Quantidade</span><input class="dinheiro num" name="qtd" inputmode="decimal" placeholder="0" value="${mv.qtd ? fmtQtd(mv.qtd) : ''}" autocomplete="off"></label>
      ${e ? `<label class="campo"><span>Valor pago (opcional)</span><input name="valor" inputmode="decimal" placeholder="R$ 0,00" value="${valorCampo(mv.valor)}"></label>
      <label style="display:flex;gap:10px;align-items:center;font-size:.9rem"><input type="checkbox" name="caixa" ${!mv.id || lanc ? 'checked' : ''} style="width:22px;min-height:22px;height:22px"> Lançar o valor como saída no caixa</label>` : ''}
      ${campoTexto('obs', 'Observação', mv.obs, e ? 'Ex.: Atacadão' : 'Ex.: encomenda da Ana')}
      ${campoData('data', 'Data', mv.data || hoje())}`;
    abrirFolha(mv.id ? (e ? 'Editar entrada' : 'Editar saída') : e ? 'Entrada de material' : 'Saída de material', corpo, f => {
      const qtd = lerValor(f.get('qtd'));
      if (!(qtd > 0)) return 'Digite a quantidade.';
      if (!f.get('data')) return 'Escolha a data.';
      const m = material(f.get('materialId'));
      const valor = e ? (lerValor(f.get('valor')) || null) : null;
      const dados = { materialId: m.id, tipo, qtd, valor, data: f.get('data'), obs: f.get('obs').trim() };
      let reg = mv.id ? db.movMat.find(x => x.id === mv.id) : null;
      if (reg) Object.assign(reg, dados); else { reg = { id: novoId(), criado: Date.now(), ...dados }; db.movMat.push(reg); }
      const querCaixa = e && valor > 0 && f.get('caixa');
      const l = reg.lancId && db.lanc.find(x => x.id === reg.lancId);
      if (querCaixa) {
        const dl = { tipo: 'saida', valor, descricao: `${m.nome} (${fmtQtd(qtd)} ${m.unidade})`, categoria: m.categoria === 'Embalagens' ? 'Embalagens' : m.categoria === 'Outros' ? 'Outros' : 'Ingredientes', forma: l ? l.forma : 'Pix', data: dados.data };
        if (l) Object.assign(l, dl); else { const id = novoId(); db.lanc.push({ id, criado: Date.now(), clienteId: null, ...dl }); reg.lancId = id; }
      } else if (l) { db.lanc = db.lanc.filter(x => x.id !== l.id); reg.lancId = null; }

    }, mv.id ? () => { db.movMat = db.movMat.filter(x => x.id !== mv.id); if (mv.lancId) db.lanc = db.lanc.filter(x => x.id !== mv.lancId); } : null);
    form.querySelectorAll('[data-trocar-tipo]').forEach(b => b.onclick = () => {
      const atual = { materialId: form.materialId.value, qtd: lerValor(form.qtd.value) || null, obs: form.obs.value, data: form.data.value };

    });
    if (!e) {
      const sel = form.materialId, q = form.qtd;
      const aviso2 = document.createElement('p'); aviso2.className = 'nota'; q.closest('.campo').after(aviso2);

      sel.onchange = chk; q.oninput = chk; chk();
    }
  }

  /* ---------- roteamento ---------- */
  const rota = () => (location.hash || '#inicio').slice(1);
  function render() {
    calcularAlocacao();
    const r = rota();
    const aba = r.startsWith('cliente-') ? 'clientes' : r.startsWith('material-') ? 'materiais' : r;
    document.querySelectorAll('.abas a').forEach(a => a.setAttribute('aria-current', a.dataset.aba === aba ? 'page' : 'false'));
    app.innerHTML = r === 'movimento' ? telaMovimento() : r === 'clientes' ? telaClientes() : r === 'analise' ? telaAnalise() : r === 'produtos' ? telaProdutos() : r === 'materiais' ? telaMateriais() : r.startsWith('material-') ? telaMaterial(r.slice(9)) : r.startsWith('cliente-') ? telaCliente(r.slice(8)) : telaInicio();
    const tp = $('#total-pendente');

    if (mostrarTotal) tp.firstElementChild.innerHTML = `Total pendente: <span class="tv num">${R(db.pedidos.reduce((t, p) => t + Math.max(0, restanteDe(p)), 0))}</span>`;
  }
  addEventListener('hashchange', () => { render(); scrollTo(0, 0); });

  /* ---------- folhas ---------- */
  const folha = $('#folha'), form = $('#folha-form');
  let aoSalvar = null;
  const cabecalho = t => `<div class="folha-cab"><h2 id="folha-titulo">${t}</h2><button type="button" class="btn-branco" data-fechar aria-label="Fechar">${ic('fechar')}</button></div>`;
  function abrirFolha(titulo, corpo, salvarFn, excluirFn, textoSalvar = 'Salvar') {
    form.innerHTML = `${cabecalho(titulo)}${corpo}<p class="erro" id="erro" role="alert"></p>
      ${salvarFn ? `<button class="btn btn-cheio" type="submit">${textoSalvar}</button>` : ''}
      ${excluirFn ? `<button class="btn btn-perigo" type="button" id="excluir">Excluir</button>` : ''}`;

      };

    folha.showModal();
    const v = $('input.dinheiro', form); if (v && !v.value) setTimeout(() => v.focus(), 60);
  }
  form.addEventListener('submit', e => {
    e.preventDefault();
    const quem = e.submitter && e.submitter.dataset.tudo ? 'tudo' : '';

    if (erro) { $('#erro', form).textContent = erro; return; }
    salvar(); folha.close(); render();
  });
  form.addEventListener('click', e => {
    if (e.target.closest('[data-fechar]')) folha.close();

    if (ch) { form.querySelectorAll('[data-forma]').forEach(b => b.setAttribute('aria-pressed', b === ch)); form.forma.value = ch.dataset.forma; }
  });

  const campoValor = (v, cls = '') => `<label class="campo"><span>Valor</span><input class="dinheiro num ${cls}" name="valor" inputmode="decimal" placeholder="R$ 0,00" value="${valorCampo(v)}" autocomplete="off"></label>`;
  const campoData = (nome, rot, v) => `<label class="campo"><span>${rot}</span><input type="date" name="${nome}" value="${v || ''}"></label>`;
  const campoTexto = (nome, rot, v, ph = '') => `<label class="campo"><span>${rot}</span><input name="${nome}" value="${esc(v)}" placeholder="${ph}" autocomplete="off"></label>`;
  const campoForma = f => `<div class="campo"><span>Forma de pagamento</span><div class="chips">${FORMAS.map(x => `<button type="button" class="chip" data-forma="${x}" aria-pressed="${x === f}">${x}</button>`).join('')}</div><input type="hidden" name="forma" value="${f}"></div>`;
  const selCliente = (sel, vazioTxt) => `<label class="campo"><span>Cliente</span><select name="clienteId"><option value="">${vazioTxt}</option>${[...db.clientes].sort((a, b) => a.nome.localeCompare(b.nome)).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select></label>`;

  function menuNovo() {
    form.innerHTML = `${cabecalho('O que você quer anotar?')}
      <div class="menu-novo">
        <button type="button" data-n="divida"><span class="marca-mov s">${ic('bolo')}</span><span>Venda no fiado<small>Cliente vai pagar depois</small></span></button>
        <button type="button" data-n="entrada"><span class="marca-mov e">${ic('pote')}</span><span>Venda paga na hora<small>Escolha os produtos e o valor soma sozinho</small></span></button>
        <button type="button" data-n="entrada" hidden><span class="marca-mov e">${ic('entra')}</span><span>Entrada<small>Dinheiro que entrou hoje</small></span></button>
        <button type="button" data-n="saida"><span class="marca-mov s">${ic('sai')}</span><span>Saída<small>Compra de ingredientes, embalagens, contas</small></span></button>
        <button type="button" data-n="material"><span class="marca-mov">${ic('caixa')}</span><span>Material comprado ou usado<small>Entrada e saída do estoque</small></span></button>
        <button type="button" data-n="cliente"><span class="marca-mov e">${ic('pessoa')}</span><span>Novo cliente<small>Nome e WhatsApp</small></span></button>
      </div>`;
    aoSalvar = null;

  /* ---------- PIN ---------- */
  async function hashPin(p) {
    const txt = 'lajuli:' + p;
    try {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return 'h1:' + [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { let h = 5381; for (const c of txt) h = (h * 33) ^ c.charCodeAt(0); return 'h0:' + (h >>> 0).toString(16); }
  }

    if (v) render(); else { $('#total-pendente').hidden = true; if (folha.open) folha.close(); }
  }
  function errou(msg) { pontos.classList.remove('treme'); void pontos.offsetWidth; pontos.classList.add('treme'); digitado = ''; desenhaPontos(); $('#cofre-dica').textContent = msg; }
  async function pinCompleto() {
    if (modoPin === 'entrar') {
      if (await hashPin(digitado) === db.pin) { tentativas = 0; mostrarApp(true); oferecerDigital(); }
      else { tentativas++; errou(tentativas >= 3 ? 'PIN errado. Confira com calma.' : 'PIN errado, tente de novo.'); }
    } else if (!primeiroPin) { primeiroPin = digitado; digitado = ''; desenhaPontos(); textoPin('Confirme o PIN', 'Digite os mesmos quatro números.'); }
    else if (digitado === primeiroPin) { db.pin = await hashPin(digitado); salvar(); mostrarApp(true); aviso('PIN salvo'); oferecerDigital(); }
    else { primeiroPin = ''; textoPin(db.pin ? 'Novo PIN' : 'Crie seu PIN', ''); errou('Os PINs não bateram. Comece de novo.'); }
  }
  function tecla(n) {
    if (cofre.hidden) return;
    if (n === 'apagar') { digitado = digitado.slice(0, -1); desenhaPontos(); return; }
    if (digitado.length >= 4) return;
    digitado += n; desenhaPontos();
    if (digitado.length === 4) setTimeout(pinCompleto, 120);
  }
  $('#teclado').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) tecla(b.dataset.k); });
  addEventListener('keydown', e => { if (cofre.hidden) return; if (/^\d$/.test(e.key)) tecla(e.key); if (e.key === 'Backspace') tecla('apagar'); });
  $('#esqueci').addEventListener('click', () => {
    const b = $('#esqueci');
    textoPin('Esqueceu o PIN?', 'Sem o PIN não dá para abrir estes dados. Você pode apagar este celular, criar um PIN novo e restaurar o último backup.');
    if (b.dataset.fase === '1') { db = vazio(); salvar(); b.dataset.fase = ''; b.textContent = 'Esqueci o PIN'; iniciarPin('novo'); return; }
    b.dataset.fase = '1'; b.textContent = 'Apagar e criar PIN novo';
  });
  /* ---------- digital (WebAuthn do próprio aparelho) ---------- */
  let suportaDigital = false;
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const deB64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const aleatorio = n => crypto.getRandomValues(new Uint8Array(n));
  async function ativarDigital() {
    const erro = $('#erro', form);
    try {
      const cred = await navigator.credentials.create({ publicKey: {
        rp: { name: 'Caderno La Julí' },
        user: { id: aleatorio(16), name: 'juli', displayName: 'Juli' },
        challenge: aleatorio(32),
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
        timeout: 60000
      } });
      db.digital = { id: b64(cred.rawId) }; salvar(); folha.close();
      aviso('Pronto: na próxima vez, entre com a digital');
    } catch (e) {
      if (erro) erro.textContent = e && e.name === 'NotAllowedError' ? 'A digital não foi confirmada. Tente de novo.' : 'Este navegador não deixou usar a digital aqui. Abra o caderno pelo endereço do site no celular.';
    }
  }
  async function entrarDigital() {
    if (!db.digital || cofre.hidden) return;
    try {
      await navigator.credentials.get({ publicKey: { challenge: aleatorio(32), allowCredentials: [{ type: 'public-key', id: deB64(db.digital.id) }], userVerification: 'required', timeout: 60000 } });
      tentativas = 0; mostrarApp(true);
    } catch (e) { $('#cofre-dica').textContent = 'Não deu para ler a digital. Toque no botão para tentar de novo ou use o PIN.'; }
  }
  function oferecerDigital() {
    if (!suportaDigital || db.digital || db.semDigital || folha.open) return;
    aoSalvar = null;
    form.innerHTML = `${cabecalho('Entrar com a digital')}
      <p class="nota" style="text-align:left">Quer abrir o caderno com a digital ou o rosto, sem digitar o PIN? O PIN continua valendo como reserva.</p>
      <button type="button" class="btn btn-cheio" data-a="digital">${ic('digital')}Usar a digital</button>
      <button type="button" class="btn" data-a="sem-digital">Agora não</button>
      <p class="nota" style="text-align:left">Dá para ligar ou desligar depois em Ajustes.</p>
      <p class="erro" id="erro" role="alert"></p>`;
    folha.showModal();
  }
  $('#btn-digital').addEventListener('click', entrarDigital);
  try {
    if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && window.isSecureContext && location.protocol === 'https:')
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(ok => {
        suportaDigital = ok;
        if (ok && db.digital && !cofre.hidden && modoPin === 'entrar') { $('#btn-digital').hidden = false; entrarDigital(); }
      }).catch(() => {});
  } catch (e) {}
  function bloquear() { if (db.pin) iniciarPin('entrar'); }
  let saiuEm = 0;
  document.addEventListener('visibilitychange', () => { if (document.hidden) saiuEm = Date.now(); else if (saiuEm && Date.now() - saiuEm > 3 * 60 * 1000) bloquear(); });

  let tt;
  function aviso(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2600); }

  /* ---------- cliques ---------- */
  $('#fab').addEventListener('click', menuNovo);
  app.addEventListener('click', e => {
    const t = e.target.closest('[data-acao],[data-filtro],[data-periodo],[data-editar-lanc],[data-pagar],[data-editar-cliente],[data-editar-produto],[data-mov]');
    if (!t) return;
    const a = t.dataset.acao;
    if (a === 'mes-ant') mudarMes(-1);
    else if (a === 'mes-prox') mudarMes(1);
    else if (a === 'nova-entrada') formLanc('entrada');
    else if (a === 'nova-saida') formLanc('saida');
    else if (a === 'nova-divida') formDivida({ clienteId: t.dataset.cliente });
    else if (a === 'pagamento-geral') formPagamentoGeral(t.dataset.cliente);
    else if (a === 'limpar-exemplo') limparExemplo();
    else if (a === 'ajustes') abrirAjustes();
    else if (t.dataset.filtro) { filtroMov = t.dataset.filtro; render(); }
    else if (t.dataset.periodo) { periodo = t.dataset.periodo; render(); }
    else if (t.dataset.pagar) formPagar(db.pedidos.find(x => x.id === t.dataset.pagar));
    else if (t.dataset.editarLanc) { const l = db.lanc.find(x => x.id === t.dataset.editarLanc); formLanc(l.tipo, l); }
    else if (t.dataset.editarCliente) formCliente(cliente(t.dataset.editarCliente));
    else if (t.dataset.editarProduto) formProduto(db.produtos.find(x => x.id === t.dataset.editarProduto));
    else if (a === 'novo-produto') formProduto();
    else if (a === 'venda-fiado') formDivida({});
    else if (a === 'novo-material') formMaterial();
    else if (a === 'editar-material') formMaterial(db.materiais.find(x => x.id === t.dataset.material));
    else if (a === 'mat-entrada') formMov('entrada', { materialId: t.dataset.material });
    else if (a === 'mat-saida') formMov('saida', { materialId: t.dataset.material });
    else if (t.dataset.mov) { const m = db.movMat.find(x => x.id === t.dataset.mov); formMov(m.tipo, m); }
  });
  app.addEventListener('input', e => {
    if (e.target.id !== 'busca') return;
    busca = e.target.value; const pos = e.target.selectionStart; render();
    const i = $('#busca'); if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  });

  iniciarPin(db.pin ? 'entrar' : 'novo');
})();
</script>

<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
